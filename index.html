<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendria – annonce immobilière et estimation par IA</title>
<style>
  :root { --fond:#ffffff; --texte:#1c2733; --discret:#5a6675; --accent:#1a3f62; }
  @media (prefers-color-scheme: dark) {
    :root { --fond:#12181f; --texte:#e6ebf0; --discret:#9aa7b5; --accent:#7dc4ee; }
  }
  body { margin:0; background:var(--fond); color:var(--texte);
         font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:2rem; color:var(--accent); margin:0 0 8px; }
  p { margin:12px 0; }
  .discret { color:var(--discret); font-size:.95rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Vendria</h1>
  <p>Votre annonce immobilière et une estimation de prix, à partir de quelques photos. Pour les particuliers qui vendent leur bien sans agence.</p>
  <p>Disponible sur l'App Store pour iPhone et iPad.</p>
  <p class="discret">
    <a href="confidentialite">Politique de confidentialité</a> ·
    Contact : <a href="mailto:contact@vendria.fr">contact@vendria.fr</a>
  </p>
</main>
</body>
</html>
